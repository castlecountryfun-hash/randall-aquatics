<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Update Stock — Randall Aquatics</title>
<style>
body { margin:0; background:#07070b; color:#f4f7ff; font-family:Segoe UI,sans-serif; padding:20px; }
h1 { font-size:28px; margin:0 0 8px; }
p { color:#9aa3c7; }
label { display:block; margin:14px 0 4px; font-weight:700; color:#3df0ff; }
textarea { width:100%; max-width:480px; padding:12px; border-radius:10px; border:1px solid #3df0ff; background:#10131f; color:#fff; font:inherit; }
button { margin-top:18px; padding:14px 20px; border:0; border-radius:999px; background:#3df0ff; color:#061016; font-weight:800; font-size:16px; }
.note { font-size:14px; margin-top:18px; }
</style>
</head>
<body>
<h1>Update stock</h1>
<p>This is the full board. Add a new line to add a species. Leave a species off the list (or set qty to 0) to remove it. Tap the button and reply.</p>
<form id="f">
  <label>FISH</label>
  <textarea id="fish" rows="8" placeholder="20+-Red cherry shrimp $3.00 each
10-Jack Dempseys $10.00 each
0-Large goldfish $10.00 each"></textarea>
  <label>SUPPLIES (gravel, decorations, filters, etc.)</label>
  <textarea id="supplies" rows="6" placeholder="5-Black gravel 5lb $8.00 each
2-Driftwood piece $12.00 each"></textarea>
  <label>PLANTS</label>
  <textarea id="plants" rows="6" placeholder="10-Java fern $4.00 each
6-Anubias $6.00 each"></textarea>
  <button type="submit">Open email to submit</button>
</form>
<p class="note"><strong>Add:</strong> new line. <strong>Remove:</strong> leave it off the list or set qty to 0. Subject will be <strong>RANDALL STOCK</strong>. Reply to the Sunday email or send this.</p>
<script>
document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault();
  const fish = document.getElementById('fish').value.trim();
  const supplies = document.getElementById('supplies').value.trim();
  const plants = document.getElementById('plants').value.trim();
  if (!fish && !supplies && !plants) return alert('Add at least one line');
  let body = '';
  if (fish) body += 'FISH\n' + fish + '\n\n';
  if (supplies) body += 'SUPPLIES\n' + supplies + '\n\n';
  if (plants) body += 'PLANTS\n' + plants + '\n\n';
  const subject = 'RANDALL STOCK';
  const mailto = 'mailto:info@randallaquatics.com?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body.trim());
  window.location.href = mailto;
});
</script>
</body>
</html>
