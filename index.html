<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Randall Aquatics</title>
<style>
:root { --ink:#07070b; --cyan:#3df0ff; --mag:#ff2bd6; --bone:#f4f7ff; --mute:#9aa3c7; }
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; color:var(--bone); font-family:"Segoe UI",sans-serif; }
body { background:
  radial-gradient(ellipse 90% 70% at 12% 0%, rgba(255,43,214,.30) 0%, rgba(255,43,214,0) 62%),
  radial-gradient(ellipse 80% 65% at 100% 16%, rgba(61,240,255,.22) 0%, rgba(61,240,255,0) 60%),
  radial-gradient(ellipse 70% 50% at 50% 100%, rgba(122,92,255,.12) 0%, rgba(122,92,255,0) 65%),
  #07070b;
  background-attachment: fixed; }
a { color:var(--cyan); }
header { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 4vw; background:rgba(7,7,11,.45); backdrop-filter:blur(8px); border-bottom:1px solid rgba(61,240,255,.2); position:sticky; top:0; z-index:5; }
.brand { display:flex; gap:10px; align-items:center; color:#fff; text-decoration:none; letter-spacing:.12em; font-size:13px; }
.brand img { width:42px; height:42px; border-radius:50%; }
nav { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
nav a { color:var(--cyan); text-decoration:none; font-size:14px; font-weight:700; border:1px solid var(--cyan); border-radius:999px; padding:6px 12px; }
nav a.on { background:var(--cyan); color:#061016; }
main { padding:28px 5vw 60px; min-height:70vh; background:transparent; }
.hero { display:grid; grid-template-columns:1.1fr .9fr; gap:24px; align-items:center; background:transparent; overflow:visible; }
h1 { font-size:clamp(42px,7vw,78px); line-height:.88; margin:8px 0; }
h1 span { background:linear-gradient(90deg,#ff2bd6,#3df0ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
.kicker { color:var(--mag); font-weight:700; }
.lede { color:#c9d2ea; max-width:40rem; }
.btns a, button.btn { display:inline-block; margin:8px 8px 0 0; padding:10px 14px; border-radius:999px; text-decoration:none; font-weight:700; border:0; cursor:pointer; font-size:15px; }
.hot { background:var(--cyan); color:#061016; }
.ghost { border:1px solid var(--mag) !important; color:var(--mag) !important; background:transparent; }
.stamp { display:inline-block; margin-top:14px; border:2px solid var(--mag); color:var(--mag); letter-spacing:.1em; font-size:12px; padding:6px 8px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; margin-top:16px; }
.card { background:#10131f; border:1px solid rgba(61,240,255,.28); border-radius:16px; overflow:hidden; }
.card img { width:100%; height:180px; object-fit:cover; display:block; background:#000; }
.meta { padding:12px 14px 16px; }
.date { color:var(--cyan); font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
.price { color:var(--mag); font-size:26px; font-weight:800; }
.was { color:var(--mute); text-decoration:line-through; font-size:14px; margin-right:6px; }
.note { color:var(--mute); max-width:44rem; }
.two { display:grid; grid-template-columns:1.1fr .9fr; gap:22px; }
.faq details { background:#10131f; border:1px solid rgba(61,240,255,.22); border-radius:12px; padding:12px 14px; margin:10px 0; }
.faq summary { cursor:pointer; font-weight:700; }
footer { padding:16px 5vw 36px; color:var(--mute); border-top:1px solid rgba(61,240,255,.2); }
.badge-wrap { display:grid; place-items:center; width:min(420px,86vw); aspect-ratio:1; margin-inline:auto; border-radius:50%; padding:8px;
  background: conic-gradient(from 90deg, #ff2bd6, #3df0ff, #7a5cff, #ff2bd6);
  box-shadow: 0 0 60px rgba(255,43,214,.35), 0 0 90px rgba(61,240,255,.2);
  animation: rock 4.5s ease-in-out infinite; }
.badge-wrap img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
@keyframes rock { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
@media (max-width:800px) { .hero,.two { grid-template-columns:1fr; } }
.home-block { margin-top:42px; }
.home-block h2 { font-size:clamp(28px,5vw,48px); margin:6px 0 8px; }
.steps { display:grid; gap:10px; margin:14px 0; }
.steps div { background:#10131f; border:1px solid rgba(61,240,255,.22); border-radius:12px; padding:10px 12px; }
.steps strong { display:block; color:var(--cyan); }
.steps span { color:#c9d2ea; }
</style>
</head>
<body>

inventory: `<p class="kicker">Live board</p><h1>IN STOCK</h1><p class="note">Every line has a thumbnail. Call or message before you drive.</p><iframe src="stock.html" title="Inventory" style="width:100%;height:80vh;border:0;border-radius:12px;background:#07070b"></iframe>`,

</div>`,
about: `<div class="two"><div><p class="kicker">The room</p><h1>BRANDON RANDALL.<br><span>PRICE, UTAH.</span></h1><p>Randall Aquatics is a buy, sell, and trade room at 315 N 100 W. Licensed and open. Brandon runs it. Amanda is in the shop with him.</p><p>Stock lives on the board and in the Facebook group. Call or message before you drive.</p><p><a href="https://www.tiktok.com/@randallaquaticsllc" target="_blank" rel="noopener">TikTok @randallaquaticsllc</a></p></div><img src="https://litter.catbox.moe/x7egoh.jpg" alt="Platinum parrot from the shop" style="width:100%;border-radius:16px"></div>`,
faq: `<p class="kicker">Before you drive</p><h1>FAQ</h1><div class="faq">
<details open><summary>Is the board today stock?</summary><p>Yes. Stock still changes. Call or message before you drive.</p></details>

contact: `<p class="kicker">Message first</p><h1>CONTACT</h1><div class="two"><div><p>315 N 100 W<br>Price, UT 84501<br><a href="tel:+14356508646">(435) 650-8646</a><br><a href="mailto:info@randallaquatics.com">info@randallaquatics.com</a></p><div class="btns"><a class="hot" href="https://maps.google.com/?q=315+N+100+W+Price+UT+84501" target="_blank" rel="noopener">Open the map</a><a class="ghost" href="https://www.facebook.com/groups/1390189834734450/" target="_blank" rel="noopener">Facebook group</a><a class="ghost" href="https://www.tiktok.com/@randallaquaticsllc" target="_blank" rel="noopener">TikTok</a></div></div><img src="https://litter.catbox.moe/jnn5ir.jpg" alt="Badge" style="width:min(360px,100%);border-radius:50%"></div>`
};
function show(id){
  if(!pages[id]) id='home';
  document.getElementById('app').innerHTML = pages[id];
  document.querySelectorAll('nav a[data-p]').forEach(a => a.classList.toggle('on', a.dataset.p===id));
}
window.addEventListener('hashchange', () => show(location.hash.slice(1)||'home'));
show(location.hash.slice(1)||'home');
</script>
</body>
</html>
