function renderDeals(){

      : s ? `<img src="${shelfEsc(s)}" alt="${shelfEsc(r.name)} (species photo)" loading="lazy" decoding="async" onerror="this.remove()">` : '');
    const q = String(r.qty).trim(), qtxt = (q === '1' && /pair/i.test(r.name)) ? '1 pair in stock' : q + ' in stock';

function shelfEsc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function shelfPrice(p){ const n = Number(p); return (p !== '' && p != null && isFinite(n)) ? '$' + (Number.isInteger(n) ? n : n.toFixed(2)) : shelfEsc(p); }
function safeImg(u){ u = String(u || '').trim(); if (!u) return '';
  if (/^https:\/\//i.test(u)) return u;

  return ''; }
function fishKey(n){ return String(n).toLowerCase().replace(/bristol nose/g,'bristlenose').replace(/[^a-z0-9+]+/g,' ').trim().split(/\s+/)

function thumb(src, alt, w, h){ return src ? `<img class="rthumb" src="${shelfEsc(src)}" alt="${shelfEsc(alt)}" loading="lazy" decoding="async" width="${w||68}" height="${h||68}" onerror="this.remove()">` : ''; }

function plainImg(r){ const s = safeImg(r.image || r.photo); return s ? thumb(s, r.name) : ''; }
function shelfCard(title, items, gid, col){

// ---- Supplies / Plants tiles ----
// Display-only name cleanup for supplies/plants (data is never changed).
const DN_KEEP = {ph:'pH', iq:'IQ', api:'API', seachem:'Seachem', tetra:'Tetra', 'accu-clear':'Accu-Clear', '3d':'3D', led:'LED', usb:'USB', co2:'CO2', uv:'UV'};
const DN_UNITS = {lb:'lb', lbs:'lb', oz:'oz', gal:'gal', gallon:'gal', gallons:'gal', ml:'ml', l:'L', g:'g', kg:'kg', in:'in', ft:'ft', w:'W'};
const DN_SMALL = new Set(['and','or','of','for','on','with','the','a','an','to','in']);
const DN_FIX = {algea:'algae'};
function displayName(raw){
  let s = String(raw || '').trim().replace(/\s+/g, ' ');
  s = s.replace(/\bFL\.?\s*OZ\b\.?/gi, 'fl oz');                 // FL OZ / FL OZ. -> fl oz
  s = s.replace(/(\d)\s*(LBS?|OZ|GAL|ML|KG)\b/gi, '$1 $2');      // 1LB -> 1 LB
  s = s.replace(/\bhang[\s-]+on[\s-]+back\b/gi, 'Hang-On-Back');
  s = s.replace(/\s*-\s+/g, ', ').replace(/([A-Za-z])-(?=(NATURAL|BLACK|WHITE|RED|BLUE|MIXED|SMALL|LARGE)\b)/gi, '$1, ');  // "Spiralis- Potted" / "GRAVEL-NATURAL"
  s = s.replace(/\s*\/\s*/g, ' / ');
  const words = s.split(' ');
  return words.map((w, i) => {
    const m = w.match(/^([^A-Za-z0-9]*)(.*?)([^A-Za-z0-9+]*)$/); const pre = m[1], core = m[2], post = m[3];
    const low = core.toLowerCase();
    if (!core) return w;
    if (DN_KEEP[low]) return pre + DN_KEEP[low] + post;
    if (low === 'fl' && (words[i+1] || '').toLowerCase().startsWith('oz')) return pre + 'fl' + post;
    if (DN_UNITS[low] && i > 0 && /(\d|^fl)$/i.test(words[i-1])) return pre + DN_UNITS[low] + post;
    if (/\d/.test(core)) return w;   // numbers, sizes, 3D, 20+
    const isUpper = core === core.toUpperCase(), isLower = core === low;
    let out = core;
    if (isUpper || isLower) {
      const fixed = DN_FIX[low] || low;
      out = (i > 0 && DN_SMALL.has(fixed)) ? fixed : fixed.replace(/(^|[-+])([a-z])/g, (a, b, c) => b + c.toUpperCase());
    }
    return pre + out + post;
  }).join(' ').replace(/\s+,/g, ',');
}
